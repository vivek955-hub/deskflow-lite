server.port=8080

# ---- Database (override with environment variables in Docker / production) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/deskflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Flyway owns the schema (see resources/db/migration). Hibernate never changes tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# ---- JWT ----
# Must be at least 32 characters. Always override JWT_SECRET outside local dev.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.expiry-minutes=480

# ---- App ----
app.seed-demo=${SEED_DEMO:true}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
app.sla.check-ms=60000

# ---- AI (optional) ----
# Leave AI_API_KEY empty and the built-in rule engine is used.
# Any OpenAI-compatible API works (Groq, OpenAI, a local Ollama server, ...).
app.ai.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:llama-3.3-70b-versatile}

springdoc.swagger-ui.path=/swagger-ui.html
logging.level.com.vivek.deskflow=INFO
