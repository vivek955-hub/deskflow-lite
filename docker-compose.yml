# One command runs everything:  docker compose up --build
# Then open http://localhost:3000
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-deskflow_root}
      MYSQL_DATABASE: deskflow
    ports:
      - "3307:3306"   # 3307 on your machine, so it does not clash with a local MySQL on 3306
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://db:3306/deskflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-deskflow_root}
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-change-me-docker-dev-secret}
      SEED_DEMO: ${SEED_DEMO:-true}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      AI_BASE_URL: ${AI_BASE_URL:-https://api.groq.com/openai/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-llama-3.3-70b-versatile}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
